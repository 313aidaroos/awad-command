<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>AWAD COMMAND — preview</title>
<style>
  :root{--void:#07080A;--glass:rgba(23,26,31,.55);--line:rgba(255,255,255,.08);--text:#E6E8EC;--muted:#8A909A;--accent:#3D8BFF;--active:#6FE3B4;--attn:#F2C14E;--err:#E5533D}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--void);color:var(--text);font-family:"Inter Tight",Inter,-apple-system,system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
  canvas{display:block;position:fixed;inset:0}
  .mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
  .glass{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:14px}
  .ui{position:fixed;pointer-events:none;transition:opacity .4s}
  #top{top:0;left:0;right:0;height:48px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;pointer-events:auto}
  #brand{font-weight:300;letter-spacing:.32em;font-size:12px}
  #modes{display:flex;gap:4px;background:rgba(23,26,31,.45);border-radius:999px;padding:3px}
  #modes button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;padding:5px 12px;border-radius:999px;cursor:pointer}
  #modes button.on{background:rgba(255,255,255,.08);color:var(--text)}
  .tag{font-size:9px;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;vertical-align:middle;margin-left:6px}
  #hud{opacity:0;transition:opacity .18s;font-size:11.5px;width:190px}
  #hud .name{font-size:13px;letter-spacing:.2em;font-weight:400;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  #hud .row{display:flex;justify-content:space-between;padding:3px 0;color:var(--muted)}
  #hud .row b{font-weight:400;color:var(--text)}
  #hud .status{margin-top:8px;font-size:10px;letter-spacing:.14em}
  #events{left:16px;bottom:96px;width:280px;padding:12px 14px;font-size:11px;pointer-events:auto;max-height:230px;overflow:hidden}
  #events h4,#news h4{font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
  .ev{display:grid;grid-template-columns:52px 1fr;gap:8px;padding:4px 0;color:var(--muted);animation:in .25s ease-out}
  .ev .t{color:var(--muted)}.ev .p{font-size:10px;letter-spacing:.08em;margin-right:6px}.ev .s{color:var(--text)}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  #news{right:16px;top:64px;width:280px;padding:12px 14px;pointer-events:auto}
  #news .filters{display:flex;gap:4px;margin-bottom:8px}
  #news .filters span{font-size:10px;color:var(--muted);padding:2px 8px;border-radius:999px;cursor:pointer}
  #news .filters span.on{background:rgba(255,255,255,.08);color:var(--text)}
  .nw{padding:6px 0;border-top:1px solid var(--line);font-size:12px;line-height:1.35}
  .nw:first-of-type{border-top:0}.nw small{display:block;font-size:10px;color:var(--muted);margin-top:2px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--active);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--active)}
  #ceo{left:50%;bottom:22px;transform:translateX(-50%);width:min(520px,calc(100% - 32px));padding:12px 18px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--muted);pointer-events:auto;cursor:text}
  #ceo .dot{background:var(--accent);box-shadow:0 0 10px var(--accent)}
  #ceo .mic{margin-left:auto;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--text)}
  #back{top:64px;left:16px;padding:8px 14px;font-size:12px;color:var(--muted);pointer-events:auto;cursor:pointer;opacity:0}
  #world{right:16px;top:64px;width:280px;padding:14px;font-size:12px;opacity:0;pointer-events:auto}
  #world h3{font-weight:300;letter-spacing:.24em;font-size:14px;margin-bottom:2px}
  #world .sub{color:var(--muted);font-size:11px;margin-bottom:10px}
  .ag{display:flex;justify-content:space-between;padding:5px 0;border-top:1px solid var(--line);color:var(--muted)}
  .ag b{font-weight:400;color:var(--text)}.ag .st{font-size:10px;letter-spacing:.1em}
  #boot{inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:var(--void);pointer-events:auto;z-index:5}
  #boot h1{font-weight:200;letter-spacing:.4em;font-size:clamp(22px,5vw,44px);opacity:0;transition:opacity 1.2s,letter-spacing 1.4s}
  #boot .sub{font-size:12px;color:var(--muted);opacity:0;transition:opacity .8s}
  #boot .list{font-size:12px;width:240px}
  #boot .list div{display:flex;justify-content:space-between;opacity:0;transition:opacity .3s;color:var(--muted)}
  #boot .list div span:last-child{color:var(--active)}
  .lbl{position:fixed;pointer-events:none;text-align:center;transform:translate(-50%,0);white-space:nowrap;transition:opacity .3s}
  .lbl .n{font-size:11px;letter-spacing:.22em;font-weight:300;color:rgba(230,232,236,.88)}
  .lbl .m{font-size:9.5px;color:var(--muted);margin-top:2px}
  @media (max-width:760px){#events{display:none}#news{width:calc(100% - 32px);top:auto;bottom:86px;padding:8px 12px}#news .filters,#news .nw+.nw{display:none}#modes{display:none}#world{width:calc(100% - 32px);top:auto;bottom:86px}#hud{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top" class="ui"><div id="brand">AWAD COMMAND<span class="tag">demo data</span></div>
  <div id="modes"><button class="on">Universe</button><button>Economy</button><button>Workforce</button></div>
  <div class="mono" style="font-size:11px;color:var(--muted)" id="clock"></div></div>

<div id="hud" class="ui glass" style="padding:12px 14px;background:radial-gradient(120% 100% at 0 0,rgba(23,26,31,.7),rgba(23,26,31,0))"></div>

<div id="events" class="ui glass"><h4><span>Event stream</span><span class="tag" style="margin:0">demo</span></h4><div id="evlist"></div></div>

<div id="news" class="ui glass">
  <h4><span><span class="dot"></span>Europe &amp; Middle East</span><span class="tag" style="margin:0">demo headlines</span></h4>
  <div class="filters"><span class="on" data-r="all">Both</span><span data-r="eu">Europe</span><span data-r="me">Middle East</span></div>
  <div id="newslist"></div>
</div>

<div id="back" class="ui glass">← Universe</div>
<div id="world" class="ui glass"></div>

<div id="ceo" class="ui glass"><span class="dot"></span><span>Ask AWAD CEO — “what needs my attention?”</span><span class="mic">🎙</span></div>

<div id="boot" class="ui"><h1 id="bt">AWAD COMMAND</h1><div class="sub" id="bs">Initializing AI ecosystem</div><div class="list mono" id="bl"></div></div>

<div id="err" class="ui mono" style="left:16px;right:16px;bottom:16px;color:#E5533D;font-size:11px;z-index:9;pointer-events:auto"></div>
<script>window.addEventListener('error',e=>{document.getElementById('err').textContent='Preview error: '+(e.message||e.error||'unknown')+(e.lineno?' (line '+e.lineno+')':'');});</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
if(typeof THREE==='undefined'){document.getElementById('err').textContent='Preview error: the 3D library could not be downloaded. Check your connection and reopen.';throw new Error('three.js failed to load')}
try{
const PROJECTS=[
 {slug:'contraxis',name:'CONTRAXIS',accent:'#3D8BFF',pos:[6.5,-0.4,7],act:.95,status:'OPERATIONAL',mrr:4821,rev:684,users:247,leads:82,agents:14,conv:11.2,
  team:['CEO Agent','Sales Agent','Lead Gen Agent','Marketing Agent','SEO Agent','Support Agent','Analytics Agent','Product Agent'],desc:'Local lead marketplace for contractors'},
 {slug:'socixis',name:'SOCIXIS',accent:'#B48CFF',pos:[-7,0.8,6],act:.8,status:'OPERATIONAL',mrr:2140,rev:212,users:96,leads:31,agents:8,conv:7.4,team:['Content Agent','Scheduler Agent','Trend Agent','Analytics Agent','Reply Agent'],desc:'AI social media for cafés & restaurants'},
 {slug:'awadbot',name:'AWADBOT',accent:'#6FE3B4',pos:[0.5,-2.2,10.5],act:.7,status:'PAPER TRADING',mrr:0,rev:1284,users:1,leads:0,agents:5,conv:61,team:['Market Analyst','News Analyst','Technical Analyst','Risk Manager','Portfolio Manager'],desc:'Personal financial AI · paper portfolio $100,000'},
 {slug:'apixis',name:'APIXIS',accent:'#5FD3F3',pos:[0,2.4,-11],act:.6,status:'OPERATIONAL',mrr:0,rev:0,users:0,leads:0,agents:7,conv:0,team:['Development Agent','Infra Agent','QA Agent','Research Agent'],desc:'Virtual world platform'},
 {slug:'publishing',name:'AWAD PUBLISHING',accent:'#F2C14E',pos:[-11,-1.8,-2],act:.5,status:'ACTIVE',mrr:640,rev:48,users:0,leads:0,agents:6,conv:0,team:['Publishing CEO','Research Agent','Writer Agent','Editor Agent','Cover Agent','Marketing Agent'],desc:'Amazon KDP operation'},
 {slug:'studios',name:'AWAD STUDIOS',accent:'#FF7A93',pos:[11,1.6,-3],act:.45,status:'ACTIVE',mrr:0,rev:0,users:0,leads:0,agents:8,conv:0,team:['Idea Agent','Story Agent','Script Agent','Director Agent','Animation Agent','Editor Agent'],desc:'Entertainment / show production'},
 {slug:'halaxis',name:'HALAXIS',accent:'#4FC3A1',pos:[-9.5,2.2,-8],act:.35,status:'ACTIVE',mrr:0,rev:0,users:0,leads:4,agents:4,conv:0,team:['Research Agent','Outreach Agent','Analytics Agent'],desc:'Halal & high-value industry ventures'},
 {slug:'rawixis',name:'RAWIXIS',accent:'#C9A66B',pos:[9,-2.6,-9],act:.4,status:'ATTENTION',mrr:0,rev:0,users:0,leads:2,agents:4,conv:0,team:['Sourcing Agent','Compliance Agent','Research Agent'],desc:'Critical & rare earth materials marketplace'},
 {slug:'lyrixis',name:'LYRIXIS',accent:'#8CA6FF',pos:[-3,-0.6,-14],act:.15,status:'IDLE',mrr:0,rev:0,users:0,leads:0,agents:3,conv:0,team:['Lyric Agent','Melody Agent'],desc:'Lyrics & song platform'}];
const LINKS=[['socixis','contraxis'],['apixis','contraxis'],['publishing','socixis'],['studios','socixis'],['apixis','halaxis']];
const STATUS={OPERATIONAL:'#3D8BFF',ACTIVE:'#6FE3B4','PAPER TRADING':'#6FE3B4',IDLE:'#5B616B',ATTENTION:'#F2C14E'};

// ---------- scene ----------
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
const isMobile=innerWidth<760;
renderer.setPixelRatio(Math.min(devicePixelRatio,isMobile?1.5:2));
renderer.setSize(innerWidth,innerHeight);renderer.setClearColor(0x07080A,1);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(innerWidth/innerHeight<1?58:45,innerWidth/innerHeight,.1,300);
function fitZoom(){const a=innerWidth/innerHeight;const half=Math.tan(camera.fov*Math.PI/360)*Math.min(a,1.4);return 14.5/half+4}
let FIT=fitZoom();
camera.position.set(0,1.5,6);
const universe=new THREE.Group();scene.add(universe);
scene.add(new THREE.AmbientLight(0xffffff,.15));
const key=new THREE.DirectionalLight(0xeef2ff,.6);key.position.set(-6,8,5);scene.add(key);
const rim=new THREE.DirectionalLight(0x3D8BFF,.3);rim.position.set(4,-3,-8);scene.add(rim);

// starfield
(()=>{const n=isMobile?1200:3500,p=new Float32Array(n*3),s=new Float32Array(n);
 for(let i=0;i<n;i++){const r=60+Math.random()*60,t=Math.random()*6.283,ph=Math.acos(2*Math.random()-1);
  p[i*3]=r*Math.sin(ph)*Math.cos(t);p[i*3+1]=r*Math.sin(ph)*Math.sin(t)*.7;p[i*3+2]=r*Math.cos(ph);s[i]=.6+Math.random()}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));g.setAttribute('aSize',new THREE.BufferAttribute(s,1));
 const m=new THREE.ShaderMaterial({transparent:true,depthWrite:false,uniforms:{},
  vertexShader:`attribute float aSize;varying float vS;void main(){vS=aSize;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=aSize*2.2*(300./-mv.z);gl_Position=projectionMatrix*mv;}`,
  fragmentShader:`varying float vS;void main(){float d=length(gl_PointCoord-.5);float a=smoothstep(.5,.1,d)*.35;gl_FragColor=vec4(.85,.88,.95,a);}`});
 const st=new THREE.Points(g,m);st.name='stars';scene.add(st);st.userData.mat=m;window._stars=st})();

// orb shader
const orbVert=`varying vec3 vN;varying vec3 vP;varying vec3 vW;void main(){vN=normalize(normalMatrix*normal);vP=position;vec4 w=modelMatrix*vec4(position,1.);vW=w.xyz;gl_Position=projectionMatrix*viewMatrix*w;}`;
const orbFrag=`uniform vec3 uA;uniform vec3 uS;uniform float uT;uniform float uAct;uniform float uH;uniform float uAlpha;varying vec3 vN;varying vec3 vP;varying vec3 vW;
float n3(vec3 p){return sin(p.x*3.1+uT)*sin(p.y*2.7-uT*.7)*sin(p.z*3.3+uT*.5)*.5+.5;}
void main(){vec3 v=normalize(cameraPosition-vW);float fr=pow(1.-max(dot(vN,v),0.),2.6);
 float sp=.4+uAct*1.2;float n=n3(vP*1.4+vec3(uT*.05*sp));n=n*.6+n3(vP*3.2-vec3(0.,uT*.08*sp,0.))*.4;
 vec3 col=uA*(.12+.45*n*(.3+uAct))+uA*fr*(1.15+uH*.35)+uS*fr*.25+vec3(.04,.045,.05);
 float a=uAlpha*(.55+.42*fr);gl_FragColor=vec4(col,a);}`;
const orbs=[];const tmp=new THREE.Vector3();
function mkLabel(txt){const d=document.createElement('div');d.className='lbl';d.innerHTML=txt;document.body.appendChild(d);return d}
function ringPts(n,r,col,size){const p=new Float32Array(n*3);for(let i=0;i<n;i++){const a=i/n*6.283,rr=r+(Math.random()-.5)*.08;p[i*3]=Math.cos(a)*rr;p[i*3+1]=(Math.random()-.5)*.04;p[i*3+2]=Math.sin(a)*rr}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(p,3));
 return new THREE.Points(g,new THREE.PointsMaterial({color:col,size,transparent:true,opacity:.75,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}))}
function halo(col,r){const cv=document.createElement('canvas');cv.width=cv.height=128;const x=cv.getContext('2d');const gr=x.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,col+'55');gr.addColorStop(.5,col+'18');gr.addColorStop(1,col+'00');x.fillStyle=gr;x.fillRect(0,0,128,128);
 const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));s.scale.set(r,r,1);return s}

PROJECTS.forEach(p=>{const g=new THREE.Group();g.position.set(...p.pos);universe.add(g);
 const A=new THREE.Color(p.accent),S=new THREE.Color(STATUS[p.status]);
 const mat=new THREE.ShaderMaterial({vertexShader:orbVert,fragmentShader:orbFrag,transparent:true,depthWrite:false,uniforms:{uA:{value:A},uS:{value:S},uT:{value:0},uAct:{value:p.act},uH:{value:0},uAlpha:{value:1}}});
 const core=new THREE.Mesh(new THREE.SphereGeometry(1.1,48,48),mat);core.userData.p=p;g.add(core);
 g.add(halo(p.accent,4.2));
 // inner particles
 const n=isMobile?40:110,pp=new Float32Array(n*3);for(let i=0;i<n;i++){const th=Math.random()*6.283,ph=Math.acos(2*Math.random()-1),rr=Math.cbrt(Math.random())*.95;const v=new THREE.Vector3(rr*Math.sin(ph)*Math.cos(th),rr*Math.sin(ph)*Math.sin(th),rr*Math.cos(ph));pp.set([v.x,v.y,v.z],i*3)}
 const ig=new THREE.BufferGeometry();ig.setAttribute('position',new THREE.BufferAttribute(pp,3));
 const inner=new THREE.Points(ig,new THREE.PointsMaterial({color:A,size:.045,transparent:true,opacity:.8,blending:THREE.AdditiveBlending,depthWrite:false}));g.add(inner);
 const r1=ringPts(80,1.55,A,.05);r1.rotation.set(1.1,0,.4);g.add(r1);
 const r2=ringPts(60,1.85,A,.04);r2.rotation.set(-.6,.8,1.2);g.add(r2);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35,.012,8,96),new THREE.MeshBasicMaterial({color:S,transparent:true,opacity:.5}));ring.rotation.x=1.35;g.add(ring);
 const stat=p.mrr?`MRR $${(p.mrr/1000).toFixed(1)}k · ${p.agents} agents`:p.slug==='awadbot'?`+$1,284 today · ${p.agents} agents`:`${p.agents} agents`;
 orbs.push({p,g,core,mat,inner,r1,r2,ring,phase:Math.random()*6.283,label:mkLabel(`<div class="n">${p.name}</div><div class="m mono">${stat}</div>`),scale:1,tScale:1})});

// CEO core
const ceo=new THREE.Group();universe.add(ceo);
const ceoMat=new THREE.ShaderMaterial({vertexShader:orbVert,fragmentShader:orbFrag,transparent:true,depthWrite:false,uniforms:{uA:{value:new THREE.Color('#dfe4ee')},uS:{value:new THREE.Color('#3D8BFF')},uT:{value:0},uAct:{value:.5},uH:{value:0},uAlpha:{value:1}}});
ceo.add(new THREE.Mesh(new THREE.SphereGeometry(.7,40,40),ceoMat));
const ico=new THREE.Mesh(new THREE.IcosahedronGeometry(1.05,1),new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.1}));ceo.add(ico);ceo.add(halo('#c9d3e6',3.4));
const ceoLabel=mkLabel('<div class="n">AWAD</div><div class="m">CEO · 59 agents</div>');

// connections
const lines=[],sparks=[];
function bez(a,b){const m=new THREE.Vector3().addVectors(a,b).multiplyScalar(.5);m.multiplyScalar(.82);return new THREE.QuadraticBezierCurve3(a,m,b)}
LINKS.forEach(([a,b])=>{const A=orbs.find(o=>o.p.slug===a),B=orbs.find(o=>o.p.slug===b);const c=bez(A.g.position,B.g.position);
 const col=new THREE.Color(A.p.accent).lerp(new THREE.Color(B.p.accent),.5);
 const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(c.getPoints(40)),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.14}));universe.add(l);lines.push({l,c,col})});
orbs.forEach(o=>{const c=bez(o.g.position,new THREE.Vector3());const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints(c.getPoints(30)),new THREE.LineBasicMaterial({color:0x8fa4c9,transparent:true,opacity:.05}));universe.add(l);lines.push({l,c,col:new THREE.Color(o.p.accent)})});
const sparkGeo=new THREE.SphereGeometry(.07,8,8);
function spark(){if(sparks.length>10)return;const L=lines[Math.floor(Math.random()*lines.length)];const m=new THREE.Mesh(sparkGeo,new THREE.MeshBasicMaterial({color:L.col,transparent:true,opacity:.9}));universe.add(m);sparks.push({m,c:L.c,t:0,dir:Math.random()<.5?1:-1})}

// ---------- interaction ----------
let rotY=0,rotX=0,tRotY=0,tRotX=0,zoom=FIT,tZoom=FIT,drag=false,px=0,py=0,pinch=0,moved=0;
let focused=null,hovered=null,camT=new THREE.Vector3(0,4,FIT),lookT=new THREE.Vector3(),look=new THREE.Vector3();
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2(-9,-9);
function down(x,y){drag=true;px=x;py=y;moved=0}
function move(x,y){if(!drag||focused)return;tRotY+=(x-px)*.005;tRotX=Math.max(-.6,Math.min(.6,tRotX+(y-py)*.003));moved+=Math.abs(x-px)+Math.abs(y-py);px=x;py=y}
canvas.addEventListener('pointerdown',e=>{down(e.clientX,e.clientY)});
addEventListener('pointermove',e=>{mouse.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);move(e.clientX,e.clientY)});
addEventListener('pointerup',e=>{drag=false;if(moved<6)click()});
canvas.addEventListener('wheel',e=>{if(focused)return;tZoom=Math.max(9,Math.min(FIT*1.5,tZoom+e.deltaY*.02))},{passive:true});
canvas.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)},{passive:true});
canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&!focused){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);tZoom=Math.max(9,Math.min(FIT*1.5,tZoom-(d-pinch)*.05));pinch=d}
 else if(e.touches.length===1){mouse.set(e.touches[0].clientX/innerWidth*2-1,-(e.touches[0].clientY/innerHeight)*2+1)}},{passive:true});
function click(){if(focused){return}if(hovered)enter(hovered)}
document.getElementById('back').onclick=leave;
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('on'));b.classList.add('on')});

const hud=document.getElementById('hud'),worldEl=document.getElementById('world'),backEl=document.getElementById('back');
function fmt(n){return '$'+n.toLocaleString()}
function showHud(o){const p=o.p;hud.innerHTML=`<div class="name">${p.name}</div>
 <div class="row"><span>MRR</span><b class="mono">${fmt(p.mrr)}</b></div><div class="row"><span>Revenue today</span><b class="mono">${fmt(p.rev)}</b></div>
 <div class="row"><span>Active users</span><b class="mono">${p.users}</b></div><div class="row"><span>New leads</span><b class="mono">${p.leads}</b></div>
 <div class="row"><span>Active agents</span><b class="mono">${p.agents}</b></div><div class="row"><span>Conversion</span><b class="mono">${p.conv}%</b></div>
 <div class="status" style="color:${STATUS[p.status]}">${p.status}<span class="tag">demo</span></div>`;hud.style.opacity=1}

function enter(o){focused=o;hovered=null;hud.style.opacity=0;const w=o.g.position.clone().applyMatrix4(universe.matrixWorld);
 const dir=w.clone().normalize();camT.copy(w).add(dir.multiplyScalar(4.6)).add(new THREE.Vector3(0,1,0));lookT.copy(w);
 orbs.forEach(x=>{x.tScale=x===o?2.2:0});ceo.visible=false;
 setTimeout(()=>{worldEl.innerHTML=`<h3>${o.p.name}</h3><div class="sub">${o.p.desc} · ${o.p.status}<span class="tag">demo</span></div>`+o.p.team.map((a,i)=>`<div class="ag"><b>${a}</b><span class="st" style="color:${['#6FE3B4','#6FE3B4','#5B616B','#6FE3B4','#F2C14E'][i%5]}">${['WORKING','WORKING','IDLE','WORKING','NEEDS APPROVAL'][i%5]}</span></div>`).join('')+`<div class="ag" style="color:var(--muted);font-size:11px;border-top:0;padding-top:10px">Full world (agents moving, pipeline particles, analytics) is built in steps 8–11 of the plan.</div>`;
  worldEl.style.opacity=1;backEl.style.opacity=1;document.getElementById('news').style.opacity=0},900);
 document.getElementById('events').style.opacity=isMobile?0:.6}
function leave(){focused=null;tZoom=FIT;camT.set(0,4,FIT);lookT.set(0,0,0);orbs.forEach(x=>x.tScale=1);ceo.visible=true;worldEl.style.opacity=0;backEl.style.opacity=0;document.getElementById('news').style.opacity=1;document.getElementById('events').style.opacity=1}

// ---------- events + news ----------
const EV=[['CONTRAXIS','Lead Agent','Received new roofing lead'],['CONTRAXIS','Sales Agent','Sent contractor outreach'],['SOCIXIS','Content Agent','Published campaign'],['APIXIS','Development Agent','Completed deployment'],['AWADBOT','Risk Manager','Updated paper-trading risk model'],['CONTRAXIS','Analytics Agent','Updated conversion statistics'],['PUBLISHING','Marketing Agent','Adjusted ad bids'],['CONTRAXIS','Sales Agent','Job won · $640'],['RAWIXIS','Compliance Agent','Supplier check failed'],['STUDIOS','Script Agent','Scene 4 draft complete'],['AWADBOT','Portfolio Manager','Simulated trade · NVDA +0.4%']];
const evlist=document.getElementById('evlist');let evi=0;
function pushEvent(){const [p,a,s]=EV[evi++%EV.length];const o=orbs.find(x=>x.p.name.startsWith(p));const d=document.createElement('div');d.className='ev';
 d.innerHTML=`<span class="t mono">${new Date().toTimeString().slice(0,8)}</span><span><span class="p" style="color:${o?o.p.accent:'#8A909A'}">${p}</span><span class="s">${a} · ${s}</span></span>`;
 evlist.prepend(d);while(evlist.children.length>6)evlist.lastChild.remove();if(o)o.mat.uniforms.uAct.value=Math.min(1,o.mat.uniforms.uAct.value+.15);spark()}
const NEWS=[['eu','ECB holds rates steady, signals cautious path into autumn','Reuters · 12m'],['me','Gulf states outline joint energy-transition fund at Riyadh summit','Al Jazeera · 24m'],['eu','EU ministers agree framework on AI infrastructure investment','Politico Europe · 41m'],['me','Turkey and Egypt expand trade corridor agreement','Reuters · 1h'],['eu','Berlin unveils housing package ahead of state elections','DW · 1h'],['me','Saudi non-oil growth beats forecasts in latest quarter','Bloomberg · 2h'],['eu','Paris transit strike enters second day','France 24 · 2h'],['me','UAE launches new visa scheme for tech founders','The National · 3h']];
let nf='all';const newslist=document.getElementById('newslist');
function renderNews(){newslist.innerHTML=NEWS.filter(n=>nf==='all'||n[0]===nf).slice(0,4).map(n=>`<div class="nw">${n[1]}<small class="mono">${n[2]}</small></div>`).join('')}
document.querySelectorAll('#news .filters span').forEach(s=>s.onclick=()=>{document.querySelectorAll('#news .filters span').forEach(x=>x.classList.remove('on'));s.classList.add('on');nf=s.dataset.r;renderNews()});renderNews();
setInterval(()=>{NEWS.push(NEWS.shift());renderNews()},8000);
setInterval(()=>document.getElementById('clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),1000);

// ---------- boot ----------
let booted=false;const bl=document.getElementById('bl');
['APIXIS','SOCIXIS','CONTRAXIS','PUBLISHING','AWADBOT','STUDIOS','RAWIXIS','LYRIXIS','CEO'].forEach(n=>{const d=document.createElement('div');const st=n==='RAWIXIS'?'ATTENTION':n==='LYRIXIS'?'IDLE':'ONLINE';d.innerHTML=`<span>${n}</span><span style="color:${st==='ONLINE'?'var(--active)':st==='IDLE'?'var(--muted)':'var(--attn)'}">${st}</span>`;bl.appendChild(d)});
setTimeout(()=>{const t=document.getElementById('bt');t.style.opacity=1;t.style.letterSpacing='.3em'},300);
setTimeout(()=>document.getElementById('bs').style.opacity=1,1400);
[...bl.children].forEach((d,i)=>setTimeout(()=>d.style.opacity=1,2000+i*180));
function reveal(){if(booted)return;booted=true;const b=document.getElementById('boot');b.style.opacity=0;setTimeout(()=>b.remove(),700);camT.set(0,4,FIT);setInterval(pushEvent,3800);pushEvent()}
setTimeout(reveal,4200);document.getElementById('boot').addEventListener('click',reveal);addEventListener('keydown',e=>{if(!booted)reveal();else if(e.key==='Escape'&&focused)leave()});

// ---------- loop ----------
const clock=new THREE.Clock();let starOp=0;
function project(v,el,dy){tmp.copy(v).project(camera);const vis=tmp.z<1;el.style.opacity=vis?el.dataset.o||1:0;el.style.left=(tmp.x*.5+.5)*innerWidth+'px';el.style.top=((-tmp.y*.5+.5)*innerHeight+dy)+'px'}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 rotY+=(tRotY-rotY)*.08;rotX+=(tRotX-rotX)*.08;zoom+=(tZoom-zoom)*.06;
 universe.rotation.y=rotY+t*.008;universe.rotation.x=rotX;universe.updateMatrixWorld();
 if(!focused)camT.set(0,4*(zoom/FIT),zoom);
 camera.position.lerp(camT,booted?(focused?.045:.05):.02);look.lerp(lookT,.06);camera.lookAt(look);
 if(booted&&starOp<1){starOp+=dt*.5;window._stars.material.opacity=starOp}
 // hover
 if(!focused&&!drag){ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(orbs.map(o=>o.core))[0];const h=hit?orbs.find(o=>o.core===hit.object):null;
  if(h!==hovered){hovered=h;canvas.style.cursor=h?'pointer':'grab';if(h)showHud(h);else hud.style.opacity=0}}
 orbs.forEach(o=>{o.mat.uniforms.uT.value=t;const a=o.mat.uniforms.uAct;a.value+=(o.p.act-a.value)*dt*.3;
  o.mat.uniforms.uH.value+=((o===hovered?1:0)-o.mat.uniforms.uH.value)*.12;o.scale+=(o.tScale*(o===hovered?1.08:1)-o.scale)*.08;o.g.scale.setScalar(Math.max(.001,o.scale));
  o.g.position.y=o.p.pos[1]+Math.sin(t*.8+o.phase)*.12;
  const sp=.15+a.value*.45;o.r1.rotation.z+=sp*dt;o.r2.rotation.z-=sp*.8*dt;o.inner.rotation.y+=sp*.5*dt;o.inner.rotation.x+=sp*.2*dt;
  if(o.p.status==='ATTENTION')o.ring.material.opacity=.35+Math.sin(t*2.6)*.2;
  o.g.getWorldPosition(tmp);const lp=tmp.clone();lp.y-=1.55*o.scale;o.label.dataset.o=focused?0:Math.min(1,Math.max(0,(FIT*1.6-camera.position.distanceTo(lp))/10));project(lp,o.label,0)});
 ceoMat.uniforms.uT.value=t;ico.rotation.y+=dt*.15;ico.rotation.x+=dt*.07;ceo.getWorldPosition(tmp);tmp.y+=1.3;ceoLabel.dataset.o=focused?0:1;project(tmp,ceoLabel,-34);
 if(hovered){hovered.g.getWorldPosition(tmp);tmp.x+=1.4*hovered.scale;tmp.project(camera);hud.style.left=Math.min(innerWidth-210,(tmp.x*.5+.5)*innerWidth)+'px';hud.style.top=Math.max(60,(-tmp.y*.5+.5)*innerHeight-60)+'px'}
 for(let i=sparks.length-1;i>=0;i--){const s=sparks[i];s.t+=dt*.4;const u=s.dir>0?s.t:1-s.t;s.c.getPoint(Math.min(1,u),s.m.position);s.m.material.opacity=.9*Math.sin(Math.min(1,s.t)*3.14);if(s.t>=1){universe.remove(s.m);sparks.splice(i,1)}}
 renderer.render(scene,camera)}
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=camera.aspect<1?58:45;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);const f=fitZoom();if(!focused&&Math.abs(tZoom-FIT)<.5)tZoom=f;FIT=f;});
}catch(e){document.getElementById('err').textContent='Preview error: '+e.message;throw e}
</script>
</body>
</html>
